
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shayeban"
version = "0.1.0"
description = "A Telegram-based claim and news fact-checking system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shayeban"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
