name: Repository Events Notification

on:
  push:
    branches: ["**"]  # تمام شاخه‌ها
  issues:
    types: [opened, closed, reopened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, closed, reopened, edited, synchronize]
  pull_request_review_comment:
    types: [created, edited]
  release:
    types: [published, created]

jobs:
  notify:
    name: Telegram Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify on Push
        if: github.event_name == 'push' && github.event.deleted == false
        uses: kioteam-ir/kio-github-actions/actions/telegram-notify@v1
        with:
          format: markdown
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          disable_notification: true
          message: |
            🆕 **Push to** `${{ github.repository }}`
            👤 By: `${{ github.actor }}`
            🌿 Ref: `${{ github.ref_name }}`
            💬 Message: `${{ github.event.head_commit.message }}`
            🔗 ${{ github.event.head_commit.url }}

      - name: Notify on Issue
        if: github.event_name == 'issues'
        uses: kioteam-ir/kio-github-actions/actions/telegram-notify@v1
        with:
          format: markdown
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          message: |
            **${{ github.event.action == 'opened' && '🆕 Issue' || github.event.action == 'closed' && '✅ Issue' || '🔄 Issue' }} #${{ github.event.issue.number }} ${{ github.event.action }}**
            📌 Title: `${{ github.event.issue.title }}`
            👤 By: `${{ github.actor }}`
            📦 Repo: `${{ github.repository }}`
            🔗 ${{ github.event.issue.html_url }}

      - name: Notify on Issue Comment
        if: github.event_name == 'issue_comment'
        uses: kioteam-ir/kio-github-actions/actions/telegram-notify@v1
        with:
          format: markdown
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          disable_notification: true
          message: |
            💬 **Comment on Issue #${{ github.event.issue.number }}**
            👤 By: `${{ github.actor }}`
            📦 Repo: `${{ github.repository }}`
            🔗 ${{ github.event.comment.html_url }}

      - name: Notify on Pull Request
        if: github.event_name == 'pull_request'
        uses: kioteam-ir/kio-github-actions/actions/telegram-notify@v1
        with:
          format: markdown
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          message: |
            **${{ github.event.action == 'opened' && '🆕 PR' || github.event.action == 'closed' && (github.event.pull_request.merged && '🔀 PR merged' || '❌ PR closed') || '🔄 PR' }} #${{ github.event.pull_request.number }} ${{ github.event.action }}**
            📌 Title: `${{ github.event.pull_request.title }}`
            👤 By: `${{ github.actor }}`
            📦 Repo: `${{ github.repository }}`
            🔗 ${{ github.event.pull_request.html_url }}

      - name: Notify on PR Review Comment
        if: github.event_name == 'pull_request_review_comment'
        uses: kioteam-ir/kio-github-actions/actions/telegram-notify@v1
        with:
          format: markdown
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          disable_notification: true
          message: |
            💬 **Review comment on PR #${{ github.event.pull_request.number }}**
            👤 By: `${{ github.actor }}`
            📦 Repo: `${{ github.repository }}`
            🔗 ${{ github.event.comment.html_url }}

      - name: Notify on Release
        if: github.event_name == 'release'
        uses: kioteam-ir/kio-github-actions/actions/telegram-notify@v1
        with:
          format: markdown
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          message: |
            🚀 **Release** `${{ github.event.release.tag_name }}` **published**
            📦 Repo: `${{ github.repository }}`
            👤 By: `${{ github.actor }}`
            🔗 ${{ github.event.release.html_url }}
